<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTREADOR DE ÔNIBUS BH</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        rel="stylesheet"
    />

    <link
        href="assets/css/styles.css"
        rel="stylesheet"  
    />
</head>
<body>
    <div class="conteiner-aplicacao">
        <aside class="barra-lateral shadow-sm">
            <div class="cabecalho-barra-lateral">
                <h1 class="h4 mb-1">Rastreador de Ônibus</h1>
                <p class="texr-muted mb-0">Transporte público de Belo Horizonte</p>
            </div>

            <hr>

            <section class="mb-4">
                <h2 class="h6 titulo-secao">Status sistema</h2>

                <div id="alerta-status" class="alert alert-info py-2 mb-3" role="alert">
                    Carregando dados dos ônibus...
                </div>

                <div class="cartao-status">
                    <span class="rotulo-status">Última atualização</span>
                    <strong id="ultima-atualizacao">--:--:--</strong>
                </div>
            </section>

            <section class="mb-4">
                <h2 class="h6 titulo-secao">Filtro por linha</h2>

                <label for="seletor-linha" class="form-label">Linha de ônibus</label>
                <select id="seletor-linha" class="form-select" disabled>
                    <option selected> ADD ISSO AQ JOÃO</option>
                </select>

                <small class="texr-muted d-block mt-2">
                    O filtro por linha será implemnetado depois, junto com os arquivos CSV
                </small>
            </section>

            <section class="d-grid gap-2">
                <button id="botao-atualizar" class="btn btn-primary">
                    Atualizar agora
                </button>

                <button id="botao-centralizar-mapa" class="btn btn-outline-secondary">
                    Centralizar em BH
                </button>
            </section>

            <hr>

            <footer class="small text-muted">
                Atualização automática a cada 20 segundos.
            </footer>
        </aside>

        <main class="area-mapa">
            <div id="mapa"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="assets/js/principal.js"></script>
    
</body>
</html>
